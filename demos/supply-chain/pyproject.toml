[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supply-chain-agent-demo"
version = "0.1.0"
description = "Multi-Vendor Supply Chain & Procurement Risk Analyst demo for teaching production AI agent engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "jupyterlab>=4.3.0",
    "ipykernel>=6.29.0",
    "frozendict>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "nbformat>=5.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supply_chain_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
